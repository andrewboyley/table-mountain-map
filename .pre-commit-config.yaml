minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: >-
          ^(?:\.mcp\.json|opencode\.json|qgis/bound\.prj|data/elevation/table_mountain_contours_2m_interpolated_5m_within_bound_bgis\.wld|data/vector/osm/trail_datasets\.manifest\.json|data/vector/tmnp/tmnp\.(?:cpg|prj))$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: verify-data
        name: verify geospatial project data
        entry: /usr/bin/python3 scripts/verify_data.py all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
