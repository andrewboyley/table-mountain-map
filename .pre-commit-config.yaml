minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
exclude: ^docker-mapproxy/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: check-ast
        files: ^scripts/.*\.py$
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: >-
          ^(?:\.mcp\.json|opencode\.json|data/vector/osm/trail_datasets\.manifest\.json)$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-format
        files: ^scripts/
      - id: ruff
        files: ^scripts/

  - repo: local
    hooks:
      - id: verify-data
        name: verify geospatial project data
        entry: /usr/bin/python3 scripts/verify_data.py all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: verify-project
        name: verify QGIS project artifact
        entry: /usr/bin/python3 scripts/verify_project.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: validate-processing-model
        name: validate trail_rebuild processing model
        entry: bash -c 'QT_QPA_PLATFORM=offscreen qgis_process help qgis/processing/trail_rebuild.model3 >/dev/null'
        language: system
        pass_filenames: false
        files: ^qgis/processing/trail_rebuild\.model3$
