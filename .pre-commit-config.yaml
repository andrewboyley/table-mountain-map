minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]
exclude: ^docker-mapproxy/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: check-ast
        files: ^scripts/.*\.py$
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '^(?:\.mcp\.json|opencode\.json)$'
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-format
        files: ^scripts/
      - id: ruff
        files: ^scripts/

  - repo: local
    hooks:
      - id: validate-processing-model
        name: validate Processing models
        entry: bash -c 'QT_QPA_PLATFORM=offscreen qgis_process help "$1" >/dev/null' --
        language: system
        pass_filenames: true
        files: ^qgis/processing/.*\.model3$
