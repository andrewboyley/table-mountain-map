# MapProxy logging configuration.
#
# Mounted at /settings/log.ini. When that file exists the image copies it to
# ${CONFIG_DATA_PATH}/log_<hostname>.ini verbatim and skips its own sed
# rewrite of the generated template.
#
# That rewrite is why this file exists. The image runs:
#
#   sed -i -e 's|%\(here\)s|<dir>|g' ... log_<hostname>.ini
#
# In a sed BRE, \( and \) are group delimiters rather than literal parens, so
# that pattern matches the string "%heres" and never matches the literal text
# "%(here)s" in the generated template. The placeholder survives untouched,
# fileConfig then resolves %(here)s to os.path.dirname(app.py) = /opt/mapproxy,
# and every log line is written into the container's writable layer where it is
# discarded on the next recreate.
#
# Writing the paths explicitly fixes that. The [DEFAULT] log_dir below points
# at /multi_mapproxy_logs, the container side of the ./logs bind mount, so the
# logs live in their own host directory instead of cluttering ./config, and they
# survive container replacement. Filenames are fixed rather than per-hostname
# because the container id changes on every recreate.
#
# The image also creates two zero-byte placeholders in the config dir
# (mapproxy_<hostname>.log, source-requests_<hostname>.log) as part of the same
# LOGGING switch that injects the fileConfig call above. They are never written
# to, because this file supplies the real handlers. Setting LOGGING=false would
# remove them but would also drop file logging entirely, so the placeholders
# stay; they are ignored in git.

[DEFAULT]
# Single definition of the log directory, shared by both handlers below through
# %(log_dir)s. This is Python's own fileConfig interpolation rather than a
# MapProxy feature, and it is why the path is written once instead of twice.
log_dir = /multi_mapproxy_logs

[loggers]
keys=root,source_requests

[handlers]
keys=mapproxy,source_requests

[formatters]
keys=default,requests

[logger_root]
level=INFO
handlers=mapproxy

[logger_source_requests]
level=INFO
qualname=mapproxy.source.request
# propagate=0 keeps upstream request lines out of the main log.
propagate=0
handlers=source_requests

[handler_mapproxy]
class=FileHandler
formatter=default
args=(r"%(log_dir)s/mapproxy.log", "a")

[handler_source_requests]
class=FileHandler
formatter=requests
args=(r"%(log_dir)s/source-requests.log", "a")

[formatter_default]
format=%(asctime)s - %(levelname)s - %(name)s - %(message)s

[formatter_requests]
format=[%(asctime)s] %(message)s
