services:
  demo:
  tms:
    use_grid_names: true
    # Serves the /tiles/ endpoint with a north-west origin so that the
    # {z}/{x}/{y} order matches the OpenStreetMap XYZ convention.
    origin: nw
  wms:
    srs:
      - 'EPSG:3857'
      - 'EPSG:4326'
      - 'EPSG:32734'
    md:
      title: MapProxy WMS
      abstract: Cached map services
  wmts:
    restful: true

layers:
  - name: osm
    title: OpenStreetMap
    sources: [osm_cache]
  - name: coct_aerial
    title: City of Cape Town Aerial Photography (2026 January)
    sources: [coct_aerial_cache]

caches:
  osm_cache:
    grids: [webmercator]
    sources: [osm_source]
    cache:
      type: file
      directory_layout: tms

  coct_aerial_cache:
    grids: [webmercator]
    sources: [coct_aerial_wms]
    cache:
      type: file
      directory_layout: tms

sources:
  osm_source:
    type: tile
    # %(z)s/%(x)s/%(y)s keeps the north-west origin used by OSM.
    # Do not use %(tms_path)s here, it flips y for the TMS service.
    url: https://tile.openstreetmap.org/%(z)s/%(x)s/%(y)s.png
    grid: webmercator
    http:
      headers:
        User-Agent: table-mountain-pov-mapproxy/1.0 (local caching proxy)

  coct_aerial_wms:
    type: wms
    coverage:
      bbox: [18.2971776915, -34.3588554361, 18.5110045901, -33.9098017744]
      bbox_srs: 'EPSG:4326'
    wms_opts:
      version: 1.1.1
    req:
      url: https://cityimg.capetown.gov.za/erdas-iws/ogc/wms/GeoSpatial%20Datasets
      layers: Aerial Imagery_Aerial Imagery 2026Jan
      transparent: false
    supported_formats: [image/jpeg]
    supported_srs: ['EPSG:3857', 'EPSG:32734']

grids:
  webmercator:
    base: GLOBAL_WEBMERCATOR
    srs: 'EPSG:3857'
    # North-west origin matches the OpenStreetMap tile scheme.
    origin: nw

globals:
  cache:
    base_dir: "/cache_data/mapproxy"
