# ---------------------------------------
# MapProxy example seeding configuration.
# ---------------------------------------
#
# This is a minimal MapProxy seeding configuration.
# See full_seed_example.yaml and the documentation for more options.
#

seeds:
  # Populate the low-zoom context over the bounding box. This provides a map
  # around the park without requesting detailed tiles outside its boundary.
  osm_table_mountain_overview:
    caches: [osm_cache]
    grids: [webmercator]
    coverages: [table_mountain_bounds]
    levels:
      from: 0
      to: 12

  # Full local detail is limited to the Table Mountain National Park boundary.
  # Level 16 is approximately 2.4 m per pixel at Table Mountain's latitude.
  osm_tmnp_detail:
    caches: [osm_cache]
    grids: [webmercator]
    coverages: [table_mountain_np]
    levels:
      from: 13
      to: 16

coverages:
  table_mountain_bounds:
    bbox: [18.2971776915, -34.3588554361, 18.5110045901, -33.9098017744]
    srs: 'EPSG:4326'

  table_mountain_np:
    datasource: /seed_data/vector/osm/tmnp_relation_338191.gpkg
    srs: 'EPSG:32734'
